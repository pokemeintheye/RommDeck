name: Xbox Webstation sync candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/xemu-webstation-save-sync]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Build RommDeck Steam Deck binary
        run: make steamdeck
      - name: Run native unit tests
        run: make unit
      - name: Run Xbox archive adapter tests
        run: python3 -m unittest discover -s tests -p 'test_xemu_webstation_archive.py' -v
